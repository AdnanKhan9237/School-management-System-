version: '3.8'

services:
  laravel_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: school-saas-backend
    container_name: school_laravel_app
    restart: unless-stopped
    volumes:
      - .:/var/www
    networks:
      - school_network

  nginx:
    image: nginx:alpine
    container_name: school_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel_app
    networks:
      - school_network

  postgresql:
    image: postgres:16-alpine
    container_name: school_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_central
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - school_network

  redis:
    image: redis:alpine
    container_name: school_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - school_network

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - .:/var/www
    depends_on:
      - redis
      - postgresql
    networks:
      - school_network

networks:
  school_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
