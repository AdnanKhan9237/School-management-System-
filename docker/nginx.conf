server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    # Charset
    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── Static assets ──────────────────────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Main Laravel entrypoint ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ────────────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass laravel_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Pass subdomain as X-Tenant header so tenant middleware can identify it
        set $subdomain "";
        if ($host ~* "^([^.]+)\.") {
            set $subdomain $1;
        }
        fastcgi_param HTTP_X_TENANT $subdomain;

        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ── Deny hidden files ──────────────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Horizon dashboard
    location /horizon {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Telescope (if installed)
    location /telescope {
        try_files $uri $uri/ /index.php?$query_string;
    }

    client_max_body_size 20M;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
