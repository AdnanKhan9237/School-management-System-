version: '3.8'

# Production overrides — use together with docker-compose.yml:
# docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  laravel_app:
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgresql:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d school_central"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-secret}"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  horizon:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
